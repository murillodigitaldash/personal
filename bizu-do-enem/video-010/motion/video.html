<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bizu do Enem · V010 · Motion</title>
<link rel="stylesheet" href="../../shared/base.css">
<link rel="stylesheet" href="../../shared/motion.css">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<style>
.lvl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px}
.lvl .o{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;border:4px solid var(--c);background:rgba(15,23,42,.8);box-shadow:0 0 40px color-mix(in srgb,var(--c) 40%,transparent)}
.lvl b{font:800 26px/1.1 var(--display);text-align:center;white-space:nowrap}
.heat{position:absolute;width:16px;height:60px;border-radius:8px;background:linear-gradient(to top,rgba(255,122,138,0),#FF7A8A)}
.bar{position:absolute;left:50%;transform:translateX(-50%);height:96px;border-radius:18px;display:flex;align-items:center;justify-content:center;font:900 40px/1 var(--display);color:#0F172A;white-space:nowrap}
.bar small{position:absolute;right:calc(100% + 18px);font:700 22px/1.1 var(--mono);color:var(--cinza-2);text-align:right;white-space:nowrap}
.pills{display:flex;gap:12px}
.ap{position:relative;flex:1;text-align:center;padding:18px 0 16px;border-radius:20px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.ap .l{font:700 18px/1 var(--mono);color:var(--cinza-2);display:block;margin-bottom:10px}
.ap .v{font:800 28px/1 var(--display);white-space:nowrap;letter-spacing:-.5px}
.ap .n{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);white-space:nowrap;font:600 18px/1.2 var(--mono);color:#FF7A8A;text-align:center}
</style>
</head>
<body>
<div id="stage"><div id="scenes"></div></div>
<script src="../../shared/kit.js"></script>
<script src="../../shared/motion.js"></script>
<script>
const {ctaFollow} = KIT;
/* tempo: narração take 1 + pausa de +1,5 s após "consumidores secundários?" (alternativas na tela) */
const T = t => t + (t > 22.25 ? 1.5 : 0);
const DUR = T(44.071) + 1.3;
const {tl, show, up, out, chap, sweep, pulse, mask, $, $$} = MOTION.init({chapters:['GANCHO','CONCEITO','APLICAÇÃO','O BIZU','CTA'], dur:DUR});

const ICON = {
  leaf:`<svg width="70" height="70" viewBox="0 0 24 24" fill="#3dd6a5"><path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15z"/><path d="M5 19L13 11" stroke="#0F172A" stroke-width="1.6"/></svg>`,
  bug:`<svg width="70" height="70" viewBox="0 0 24 24" fill="#FFC400"><ellipse cx="12" cy="13" rx="5" ry="7"/><circle cx="12" cy="5" r="2.6"/><path d="M7 10H3M7 14H3M17 10h4M17 14h4" stroke="#FFC400" stroke-width="1.6"/></svg>`,
  bird:`<svg width="70" height="70" viewBox="0 0 24 24" fill="#4CC9F0"><path d="M3 14c4 0 6-6 11-6 3 0 5 2 7 2-2 1-3 2-4 4-2 4-6 5-10 4l-4 2 1-3c-1-1-1-2-1-3z"/></svg>`,
  hawk:`<svg width="70" height="70" viewBox="0 0 24 24" fill="#FF7A8A"><path d="M2 9l7 2 3-5 3 5 7-2-6 5 1 6-5-3-5 3 1-6z"/></svg>`};
const LV=[['Produtor','leaf','#3dd6a5'],['Consumidor 1º','bug','#FFC400'],['Consumidor 2º','bird','#4CC9F0'],['Consumidor 3º','hawk','#FF7A8A']];
const ALTS=[['A','1.000 kcal','10% uma vez só'],['B','100 kcal',''],['C','10 kcal',''],['D','9.000 kcal','subtraiu 10%'],['E','8.100 kcal','']];

$('#scenes').innerHTML=`
<section id="s1">
  <div class="abs" style="left:84px;top:390px"><div class="kicker mask" style="margin-bottom:28px"><span id="s1k">Biologia · Ecologia</span></div>
    <div class="h-l nowrap" style="font-size:104px">${mask('Por que a cadeia','s1a')}${mask('alimentar é','s1b')}${mask('tão curta?','s1c','y')}</div></div>
  <div id="s1chain" class="abs" style="left:60px;top:900px;width:870px;height:420px">
    ${LV.map(([n,ic,c],i)=>`<div class="lvl" id="l${i}" style="left:${110+i*217}px;top:200px;--c:${c}"><div class="o">${ICON[ic]}</div><b>${n.replace(' ','<br>')}</b></div>`).join('')}
    ${[0,1,2].map(i=>`<svg class="abs arr" style="left:${190+i*217}px;top:178px" width="56" height="44" viewBox="0 0 56 44"><path d="M2 22H46M34 8l14 14-14 14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`).join('')}
    <div id="s1q" class="abs" style="left:800px;top:-10px;font:900 90px/1 var(--display);color:var(--amarelo)">?</div>
  </div>
</section>

<section id="s2">
  <div class="abs" style="left:84px;top:390px"><div style="position:relative;height:60px;width:900px">
    <div class="abs kicker mask" style="left:0;top:0"><span id="s2k">Fluxo de energia</span></div></div>
    <div style="position:relative;height:230px;width:920px">
      <div class="abs h-l nowrap" style="left:0;top:0;font-size:96px">${mask('A maior parte','s2a')}${mask('<span style="color:#FF7A8A">vira calor</span>','s2b')}</div>
      <div class="abs h-l nowrap" style="left:0;top:0;font-size:96px">${mask('Só uns 10%','s2c')}${mask('<span class="y">passam adiante</span>','s2d')}</div>
    </div></div>
  <div id="s2box" class="abs card" style="left:60px;top:740px;width:870px;height:620px;overflow:hidden">
    <div class="lvl" style="left:220px;top:370px;--c:#3dd6a5"><div class="o">${ICON.leaf}</div><b>Nível 1</b></div>
    <div class="lvl" id="s2n2" style="left:650px;top:370px;--c:#FFC400"><div class="o">${ICON.bug}</div><b>Nível 2</b></div>
    <svg class="abs" style="left:300px;top:330px" width="270" height="80" viewBox="0 0 270 80"><path id="s2arrow" d="M10 40H240M220 18l24 22-24 22" stroke="#FFC400" stroke-width="10" fill="none" stroke-linecap="round"/></svg>
    <div id="s2pct" class="abs" style="left:350px;top:250px;font:900 64px/1 var(--display);color:var(--amarelo)">10%</div>
    ${[...Array(9)].map((_,i)=>`<div class="heat" style="left:${130+i*22}px;top:${180+(i%3)*14}px"></div>`).join('')}
    <div id="s2heat" class="abs" style="left:60px;top:60px;font:800 34px/1.1 var(--display);color:#FF7A8A">−90% <span style="font:600 24px/1 var(--mono);color:var(--cinza-2)">calor · respiração</span></div>
  </div>
</section>

<section id="s3">
  <div class="abs" style="left:84px;top:380px"><div style="position:relative;height:60px;width:900px">
    <div class="abs kicker mask" style="left:0;top:0"><span id="s3k">Vamos aplicar</span></div>
    <div class="abs kicker mask" style="left:0;top:0;color:var(--amarelo)"><span id="s3k2">Quanto chega aos secundários?</span></div>
    <div class="abs kicker mask" style="left:0;top:0;color:#FF7A8A"><span id="s3k3">⚠ As armadilhas</span></div>
    <div class="abs kicker mask" style="left:0;top:0;color:#3dd6a5"><span id="s3k4">Pirâmide de energia: nunca invertida</span></div></div></div>
  <div id="s3pyr" class="abs" style="left:60px;top:470px;width:870px;height:660px">
    <div class="bar" id="b2" style="top:150px;width:150px;background:#4CC9F0"><span>100</span><small>consumidor<br>secundário</small></div>
    <div class="bar" id="b1" style="top:290px;width:360px;background:#FFC400"><span>1.000</span><small>consumidor<br>primário</small></div>
    <div class="bar" id="b0" style="top:430px;width:720px;background:#3dd6a5"><span>10.000 kcal</span></div>
    <div class="abs" id="b0l" style="left:75px;top:546px;font:700 22px/1 var(--mono);color:var(--cinza-2)">produtores</div>
    <div class="abs op" id="o1" style="left:640px;top:330px;font:900 40px/1 var(--mono);color:var(--amarelo)">÷ 10</div>
    <div class="abs op" id="o2" style="left:540px;top:190px;font:900 40px/1 var(--mono);color:var(--amarelo)">÷ 10</div>
    <div class="abs" id="b2q" style="left:385px;top:150px;width:100px;height:96px;border-radius:18px;border:3px dashed var(--amarelo);display:grid;place-items:center;font:900 54px/1 var(--display);color:var(--amarelo)">?</div>
  </div>
  <div id="s3alts" class="abs" style="left:60px;top:1250px;width:870px"><div class="pills">
    ${ALTS.map(([l,v,n])=>`<div class="ap" id="a${l}"><span class="l">${l}</span><span class="v">${v}</span>${n?`<span class="n aNote">${n}</span>`:''}</div>`).join('')}</div></div>
</section>

<section id="s4">
  <div class="abs" style="left:84px;top:390px"><div class="kicker mask" style="margin-bottom:28px;color:var(--amarelo)"><span id="s4k">O bizu</span></div>
    <div class="h-l nowrap">${mask('A cada nível,','s4a')}${mask('divida por 10','s4b','y')}</div></div>
  <div id="s4row" class="abs card" style="left:60px;top:860px;width:870px;padding:44px 40px;display:flex;align-items:center;justify-content:space-between">
    ${['10.000','1.000','100','10'].map((v,i)=>`<div class="s4v" style="font:900 ${54-i*6}px/1 var(--display);color:${['#3dd6a5','#FFC400','#4CC9F0','#FF7A8A'][i]}">${v}</div>${i<3?'<div class="s4a" style="font:800 26px/1 var(--mono);color:var(--cinza-2)">÷10</div>':''}`).join('')}
  </div>
</section>

<section id="s5">
  <div class="abs" style="left:84px;top:390px"><div class="kicker mask" style="margin-bottom:28px"><span id="s5k">Curtiu o bizu?</span></div>
    <div class="h-l">${mask('Salva','s5a')}${mask('e segue','s5b','y')}</div></div>
  <div id="s5cards" class="abs" style="left:84px;top:800px;display:flex;flex-direction:column;gap:28px">${ctaFollow('pra revisar antes da prova')}</div>
</section>`;

/* 01 GANCHO: 0 → 3.8 */
show('#s1',0,4.2);
up('#s1k',.05); up('#s1a',0); up('#s1b',T(.43)); up('#s1c',T(1.23),{color:'#fff'}); tl.to('#s1c',{color:'#FFC400',duration:.25},T(1.5));
LV.forEach((_,i)=>tl.from(`#l${i}`,{opacity:0,scale:.6,duration:.4,ease:'back.out(2)'},.4+i*.35));
tl.from('.arr',{opacity:0,x:-20,duration:.3,stagger:.35},.6);
tl.from('#s1q',{opacity:0,scale:0,rotation:-30,duration:.45,ease:'back.out(2)'},T(2.8)); pulse('#s1q',T(3.2),1.2);
out(['#s1k','#s1a','#s1b','#s1c'],3.75,{stagger:.03}); tl.to('#s1chain',{y:-60,opacity:0,duration:.4,ease:'power3.in'},3.75);

/* 02 CONCEITO: 3.9 → 15.1 */
const s2in=3.9, s2out=T(15.1);
show('#s2',s2in,s2out+.5); chap(1,s2in);
up('#s2k',T(3.94)); pulse('#s2k',T(4.75),1.06);
tl.from('#s2box',{y:160,opacity:0,duration:.8,ease:'expo.out'},T(4.3));
up('#s2a',T(7.64)); up('#s2b',T(8.87));
tl.set('.heat',{opacity:0},0); tl.set(['#s2heat','#s2pct'],{opacity:0},0); tl.set('#s2arrow',{strokeDasharray:300,strokeDashoffset:300},0);
$$('.heat').forEach((h,i)=>{ tl.fromTo(h,{opacity:0,y:30},{opacity:1,y:-60,duration:1.4,ease:'sine.out',immediateRender:false},T(9.5)+i*.12);
  tl.to(h,{opacity:0,duration:.6},T(9.5)+i*.12+1.0); tl.fromTo(h,{opacity:0,y:30},{opacity:.8,y:-60,duration:1.4,ease:'sine.out',immediateRender:false},T(11.2)+i*.1); tl.to(h,{opacity:0,duration:.6},T(11.2)+i*.1+1.0); });
tl.to('#s2heat',{opacity:1,duration:.35},T(10.44)); pulse('#s2heat',T(10.5),1.08);
out(['#s2a','#s2b'],T(11.85),{duration:.3}); up('#s2c',T(11.97)); up('#s2d',T(13.49));
tl.to('#s2arrow',{strokeDashoffset:0,duration:.8,ease:'power2.inOut'},T(12.6));
tl.to('#s2pct',{opacity:1,duration:.35},T(12.6)); pulse('#s2pct',T(13.1),1.15);
tl.from('#s2n2',{opacity:.25,duration:.4},T(13.4)); pulse('#s2n2 .o',T(13.5),1.1);
out(['#s2k','#s2c','#s2d'],s2out,{stagger:.03}); tl.to('#s2box',{y:-60,opacity:0,duration:.4,ease:'power3.in'},s2out);
sweep(s2out+.05);

/* 03 APLICAÇÃO */
const s3in=T(15.25), s3out=T(39.15);
show('#s3',s3in,s3out+.5); chap(2,s3in);
up('#s3k',T(15.28));
tl.set(['#b1','#b2','#o1','#o2'],{opacity:0},0); tl.set('#b2q',{opacity:0},0); tl.set('.aNote',{opacity:0},0);
tl.from('#b0',{scaleX:0,duration:.6,ease:'expo.out'},T(16.59)); tl.from('#b0l',{opacity:0,duration:.3},T(16.9)); pulse('#b0',T(18.45),1.04);
out('#s3k',T(20.0),{duration:.3}); up('#s3k2',T(20.07));
tl.to('#b2q',{opacity:1,duration:.3},T(20.77)); pulse('#b2q',T(21.4),1.12);
// alternativas (pausa de 1,5 s)
tl.from('#s3alts .ap',{opacity:0,y:30,duration:.35,stagger:.07,ease:'back.out(1.6)'},T(21.6));
tl.to('#o1',{opacity:1,duration:.3},T(24.8));
tl.fromTo('#b1',{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:.5,ease:'expo.out',immediateRender:false},T(25.97));
tl.to('#o2',{opacity:1,duration:.3},T(28.5));
tl.to('#b2q',{opacity:0,duration:.2},T(29.4));
tl.fromTo('#b2',{opacity:0,scaleX:0},{opacity:1,scaleX:1,duration:.5,ease:'expo.out',immediateRender:false},T(29.43));
tl.to('#aB',{borderColor:'#FFC400',background:'rgba(255,196,0,.15)',duration:.3},T(29.6)); pulse('#aB',T(29.6),1.08);
out('#s3k2',T(30.9),{duration:.3}); up('#s3k3',T(30.99));
tl.to('#aA',{borderColor:'#FF7A8A',duration:.3},T(31.72)); tl.to('#aA .aNote',{opacity:1,duration:.3},T(31.8));
tl.to('#aD',{borderColor:'#FF7A8A',duration:.3},T(33.94)); tl.to('#aD .aNote',{opacity:1,duration:.3},T(34.0));
tl.to(['#aC','#aE'],{opacity:.4,duration:.3},T(34.2));
out('#s3k3',T(35.6),{duration:.3}); up('#s3k4',T(35.69));
tl.to('#s3alts',{opacity:0,y:30,duration:.35},T(36.4));
tl.to('#s3pyr',{y:80,duration:.6,ease:'power2.inOut'},T(36.4));
tl.to('#s3pyr .op',{opacity:0,duration:.3},T(36.4));
pulse(['#b0','#b1','#b2'],T(37.1),1.05);
out('#s3k4',s3out,{duration:.3}); tl.to('#s3pyr',{opacity:0,y:20,duration:.4,ease:'power3.in'},s3out);

/* 04 BIZU */
const s4in=T(39.3), s4out=T(41.7);
show('#s4',s4in,s4out+.5); chap(3,s4in);
up('#s4k',T(39.33)); up('#s4a',T(40.07)); up('#s4b',T(40.77),{color:'#fff'}); tl.to('#s4b',{color:'#FFC400',duration:.25},T(41.0));
tl.from('#s4row',{y:120,opacity:0,duration:.5,ease:'expo.out'},T(39.6));
tl.from('.s4v',{opacity:0,y:20,duration:.3,stagger:.18},T(39.9)); tl.from('.s4a',{opacity:0,duration:.25,stagger:.18},T(40.0));
out(['#s4k','#s4a','#s4b'],s4out,{stagger:.03,duration:.32}); tl.to('#s4row',{y:-40,opacity:0,duration:.3,ease:'power3.in'},s4out);

/* 05 CTA */
const s5in=T(41.78);
show('#s5',s5in,DUR+1); chap(4,s5in);
up('#s5k',s5in+.05); up('#s5a',T(41.8));
const [save,follow]=$$('#s5cards > .card');
tl.from(save,{x:-200,opacity:0,duration:.6,ease:'expo.out'},T(41.85)); pulse(save.firstElementChild,T(42.2),1.15);
up('#s5b',T(42.67),{color:'#fff'}); tl.to('#s5b',{color:'#FFC400',duration:.25},T(42.83));
tl.from(follow,{x:-200,opacity:0,duration:.6,ease:'expo.out'},T(42.7));
pulse(follow.lastElementChild,T(43.18),1.12); pulse(follow.lastElementChild,T(44.5),1.08);
tl.to('#stage .brand',{scale:1.08,transformOrigin:'0 50%',duration:.3,yoyo:true,repeat:1,ease:'power2.out'},T(43.18));

MOTION.ready();
</script>
</body>
</html>
