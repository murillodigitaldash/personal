<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bizu do Enem · V002 · Styleframes</title>
<style>
:root{
  --roxo:#6C3BFF; --roxo-claro:#9C7BFF; --amarelo:#FFC400; --navy:#0F172A; --verde:#3dd6a5;
  --cinza-1:#E7EAF0; --cinza-2:#A9B1C4; --cinza-3:#5B6680;
  --display:"Inter Display","Inter",sans-serif; --texto:"Inter",sans-serif; --mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
.frame{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--texto);color:#fff;
  background:radial-gradient(900px 700px at 80% 18%, rgba(108,59,255,.38), transparent 70%),
    radial-gradient(800px 800px at 10% 92%, rgba(108,59,255,.22), transparent 70%),
    linear-gradient(180deg,#111a30 0%, var(--navy) 55%, #0b1122 100%)}
.frame::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 45%,#000 30%,transparent 85%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 65% at 50% 50%,transparent 55%,rgba(5,8,18,.55) 100%)}
.brand{position:absolute;left:84px;top:252px;display:flex;align-items:center;gap:16px;z-index:5}
.brand .word{font:900 36px/1 var(--display);letter-spacing:-1.2px}
.brand .word b{font:800 17px/1 var(--display);letter-spacing:2.4px;color:var(--amarelo);margin-left:8px;vertical-align:6px}
.chapter{position:absolute;right:180px;top:266px;font:600 24px/1 var(--mono);color:var(--cinza-2);letter-spacing:2px;z-index:5}
.chapter i{font-style:normal;color:var(--amarelo)}
.h-xl{font:900 150px/.92 var(--display);letter-spacing:-6px}
.h-l{font:900 112px/.95 var(--display);letter-spacing:-4px}
.kicker{font:600 26px/1 var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--roxo-claro)}
.y{color:var(--amarelo)} .abs{position:absolute}
.note{font:500 24px/1.2 var(--mono);color:var(--cinza-3);letter-spacing:1px}
.tok{width:var(--s,64px);height:var(--s,64px);border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.tok svg{width:46%;height:46%}
.tok.ok{background:radial-gradient(circle at 35% 30%,#8d66ff,var(--roxo) 60%,#4f22e0);box-shadow:0 8px 22px rgba(108,59,255,.45),inset 0 2px 0 rgba(255,255,255,.25)}
.tok.err{background:rgba(255,255,255,.03);border:3px solid rgba(169,177,196,.35)}
.tok.warn{background:rgba(255,196,0,.10);border:3px solid var(--amarelo);box-shadow:0 0 30px rgba(255,196,0,.35)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.12);
  border-radius:36px;box-shadow:0 40px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.pill{display:inline-flex;align-items:center;gap:12px;padding:16px 26px;border-radius:999px;font:700 30px/1 var(--display);white-space:nowrap}
/* stepper dos 3 erros */
.stepper{position:absolute;left:84px;top:350px;display:flex;gap:14px}
.step{display:flex;align-items:center;gap:12px;padding:12px 20px 12px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);font:700 24px/1 var(--display);color:var(--cinza-2)}
.step .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 18px/1 var(--mono);background:rgba(255,255,255,.08)}
.step.on{border-color:var(--amarelo);color:#fff;background:rgba(255,196,0,.10)}
.step.on .n{background:var(--amarelo);color:var(--navy)}
.step.done .n{background:var(--roxo);color:#fff}
.safe{position:absolute;inset:0;pointer-events:none;z-index:99;display:none}
.show-safe .safe{display:block}
.safe .top{position:absolute;left:0;right:0;top:0;height:220px;background:rgba(255,0,80,.25)}
.safe .bot{position:absolute;left:0;right:0;bottom:0;height:420px;background:rgba(255,0,80,.25)}
.safe .right{position:absolute;right:0;top:220px;bottom:420px;width:150px;background:rgba(255,0,80,.18)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const P=new URLSearchParams(location.search), F=+(P.get('f')||1);
if(P.get('safe')) document.body.classList.add('show-safe');
const CHECK=`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>`;
const CROSS=(c='#A9B1C4')=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const tok=(k,s=64)=>`<div class="tok ${k}" style="--s:${s}px">${k==='ok'?CHECK:k==='warn'?CROSS('#FFC400'):CROSS()}</div>`;
const MARK=(size,{bg='#6C3BFF',fg='#fff',bolt='#FFC400'}={})=>`<svg width="${size}" height="${size}" viewBox="0 0 120 120">
  <rect width="120" height="120" rx="34" fill="${bg}"/><rect x="27" y="20" width="17" height="78" rx="8.5" fill="${fg}"/>
  <circle cx="60" cy="72" r="23" fill="none" stroke="${fg}" stroke-width="17"/>
  <path d="M92 10 L81 29 L90 29 L84 45 L103 24 L93 24 L100 10 Z" fill="${bolt}"/></svg>`;
const brand=(ch,l)=>`<div class="brand">${MARK(54)}<div class="word">bizu<b>DO ENEM</b></div></div><div class="chapter"><i>${ch}</i> / ${l}</div>`;
const shell=i=>`<div class="frame">${i}<div class="vignette"></div><div class="grain"></div><div class="safe"><div class="top"></div><div class="bot"></div><div class="right"></div></div></div>`;
const stepper=a=>`<div class="stepper">${['Comando','Tempo','Troca'].map((l,i)=>`<div class="step ${i+1===a?'on':i+1<a?'done':''}"><span class="n">${i+1<a?'✓':'0'+(i+1)}</span>${l}</div>`).join('')}</div>`;
const opts=(mark,{hi=-1,ghost=-1}={})=>['A','B','C','D','E'].map((l,i)=>`<div style="display:flex;align-items:center;gap:18px;margin-bottom:12px">
  <div style="width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:800 24px/1 var(--display);
  ${i===mark?'background:var(--amarelo);color:var(--navy);box-shadow:0 0 24px rgba(255,196,0,.5)':i===ghost?'border:3px dashed var(--amarelo);color:var(--amarelo)':'border:2px solid rgba(255,255,255,.2);color:var(--cinza-2)'}">${l}</div>
  <div style="height:14px;width:${[60,48,66,52,44][i]}%;border-radius:7px;background:${i===mark?'rgba(255,196,0,.55)':'rgba(255,255,255,.12)'}"></div></div>`).join('');

const frames={
// 01 — GANCHO
1:()=>shell(`${brand('01','GANCHO')}
  <div class="abs" style="left:0;right:0;top:0;bottom:0;perspective:1400px">
    <div class="abs" style="left:-120px;top:1440px;width:1400px;transform:rotateX(62deg) rotateZ(-8deg);transform-origin:50% 0;display:flex;flex-wrap:wrap;gap:34px;opacity:.85">
      ${Array.from({length:84},(_,i)=>tok([9,17,30].includes(i)?'warn':(i*7)%5!==0?'ok':'err',92)).join('')}</div></div>
  <div class="abs" style="left:0;right:0;top:1350px;height:520px;background:linear-gradient(180deg,var(--navy),transparent 60%)"></div>
  <div class="abs" style="left:84px;top:400px"><div class="kicker">Reta final · ENEM 2026</div></div>
  <div class="abs" style="left:56px;top:430px;font:900 560px/1 var(--display);letter-spacing:-30px;color:var(--amarelo);text-shadow:0 0 120px rgba(255,196,0,.35)">3</div>
  <div class="abs" style="left:420px;top:540px;display:flex;flex-direction:column;gap:22px">${['warn','warn','warn'].map(k=>tok(k,92)).join('')}</div>
  <div class="abs h-l" style="left:84px;top:1010px">erros que<br>podem custar<br><span class="y">pontos</span></div>`),

// 02 — ERRO 1: comando até o fim
2:()=>shell(`${brand('02','ERRO 1')}${stepper(1)}
  <div class="abs h-l" style="left:84px;top:450px">Leia o comando<br><span class="y">até o fim</span></div>
  <div class="abs" style="left:0;right:0;top:760px;perspective:1800px">
   <div class="card" style="margin-left:60px;width:870px;padding:44px 46px 40px;transform:rotateY(-8deg) rotateX(5deg);transform-origin:20% 50%">
    <div class="note" style="color:var(--roxo-claro);margin-bottom:24px">QUESTÃO 12 · COMANDO</div>
    <div style="font:600 44px/1.35 var(--texto);color:var(--cinza-1);position:relative">
      <span style="background:linear-gradient(90deg,rgba(108,59,255,.55),rgba(108,59,255,.35));box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 6px;border-radius:8px">Considerando as informações do texto, é</span>
      <span style="position:relative;display:inline-block;padding:0 10px;border-radius:10px;background:var(--amarelo);color:var(--navy);font-weight:900;box-shadow:0 0 40px rgba(255,196,0,.5)">INCORRETO</span>
      <span style="opacity:.55">afirmar que:</span>
    </div>
    <div style="margin-top:36px;display:flex;align-items:center;gap:16px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFC400" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <div style="font:600 30px/1.3 var(--texto);color:var(--cinza-1)">A palavra que muda tudo<br>pode estar <b class="y">no fim</b>.</div>
    </div>
   </div>
  </div>`),

// 03 — ERRO 2: tempo
3:()=>{const n=18;return shell(`${brand('03','ERRO 2')}${stepper(2)}
  <div class="abs h-l" style="left:84px;top:450px;font-size:92px">Não gaste o tempo<br>numa <span class="y">só questão</span></div>
  <div class="abs card" style="left:60px;top:800px;width:870px;padding:44px 40px 40px">
    <div style="display:flex;justify-content:space-between;margin-bottom:18px"><div class="note" style="color:var(--roxo-claro)">TEMPO DE PROVA</div><div class="note" style="color:var(--cinza-2)">⏱</div></div>
    <div style="display:flex;height:34px;border-radius:17px;overflow:hidden;background:rgba(255,255,255,.07);margin-bottom:46px">
      <div style="width:9%;background:var(--roxo)"></div><div style="width:6%;background:#5a2fe0"></div>
      <div style="width:68%;background:repeating-linear-gradient(135deg,var(--amarelo) 0 14px,#e6b000 14px 28px);box-shadow:0 0 30px rgba(255,196,0,.5)"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:26px 0;justify-items:center">
      ${Array.from({length:n},(_,i)=>i<2?tok('ok',74):i===2?`<div style="position:relative">${tok('warn',74)}
        <svg class="abs" style="left:-16px;top:-16px" width="106" height="106" viewBox="0 0 106 106"><circle cx="53" cy="53" r="49" fill="none" stroke="rgba(255,196,0,.25)" stroke-width="6"/><circle cx="53" cy="53" r="49" fill="none" stroke="#FFC400" stroke-width="6" stroke-dasharray="${2*Math.PI*49*0.82} 999" transform="rotate(-90 53 53)" stroke-linecap="round"/></svg></div>`
        :`<div class="tok" style="--s:74px;border:3px dashed rgba(169,177,196,.3);font:700 24px/1 var(--mono);color:var(--cinza-3)">${String(i+1).padStart(2,'0')}</div>`).join('')}
    </div>
    <div style="margin-top:34px;font:600 32px/1.3 var(--texto);color:var(--cinza-1)">Travou? <b class="y">Pule e volte depois.</b></div>
  </div>`)},

// 04 — ERRO 3: trocar sem motivo
4:()=>shell(`${brand('04','ERRO 3')}${stepper(3)}
  <div class="abs h-l" style="left:84px;top:450px;font-size:100px">Só troque com<br><span class="y">motivo concreto</span></div>
  <div class="abs card" style="left:60px;top:800px;width:520px;padding:38px 40px 28px">
    <div class="note" style="color:var(--roxo-claro);margin-bottom:24px">SUA RESPOSTA</div>${opts(2,{ghost:3})}
  </div>
  <svg class="abs" style="left:430px;top:1010px" width="230" height="160" viewBox="0 0 230 160"><path d="M10 40 C 90 0, 170 40, 200 120" stroke="#FFC400" stroke-width="5" fill="none" stroke-dasharray="12 10" stroke-linecap="round"/></svg>
  <div class="abs card" style="left:600px;top:1100px;width:330px;padding:30px 30px;border-color:rgba(255,196,0,.5)">
    <div style="font:800 34px/1.1 var(--display);margin-bottom:20px">Motivo<br>concreto?</div>
    <div class="pill" style="font-size:24px;padding:12px 18px;background:rgba(61,214,165,.16);color:var(--verde);margin-bottom:10px">Sim → troca</div>
    <div class="pill" style="font-size:24px;padding:12px 18px;background:rgba(255,255,255,.08);color:var(--cinza-1)">Não → mantém</div>
  </div>`),

// 05 — NA PRÁTICA
5:()=>shell(`${brand('05','NA PRÁTICA')}
  <div class="abs" style="left:84px;top:390px"><div class="kicker" style="margin-bottom:28px">Na prática</div>
    <div class="h-l">Confira.<br>Justifique.<br><span class="y">Marque.</span></div></div>
  <div class="abs card" style="left:60px;top:900px;width:870px;padding:40px 44px 34px">
    ${[['Enunciado conferido','li até o fim, achei a palavra-chave'],['Escolha justificada','sei dizer por que é a C']].map(([a,b])=>`
    <div style="display:flex;align-items:center;gap:22px;margin-bottom:26px">${tok('ok',64)}
      <div><div style="font:800 36px/1.1 var(--display)">${a}</div><div class="note" style="color:var(--cinza-2);margin-top:8px">${b}</div></div></div>`).join('')}
    <div style="height:1.5px;background:rgba(255,255,255,.1);margin:8px 0 28px"></div>
    <div style="display:flex;gap:18px;align-items:center">
      ${['A','B','C','D','E'].map((l,i)=>`<div style="width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font:800 32px/1 var(--display);
        ${i===2?'background:var(--amarelo);color:var(--navy);box-shadow:0 0 34px rgba(255,196,0,.55)':'border:2.5px solid rgba(255,255,255,.2);color:var(--cinza-2)'}">${l}</div>`).join('')}
      <div style="margin-left:10px;font:700 30px/1 var(--display);color:var(--amarelo)">← agora sim</div>
    </div>
  </div>`),

// 06 — CTA
6:()=>shell(`${brand('06','CTA')}
  <div class="abs" style="left:84px;top:390px"><div class="kicker" style="margin-bottom:28px">Curtiu o bizu?</div>
    <div class="h-l">Salva<br><span class="y">e segue</span></div></div>
  <div class="abs" style="left:84px;top:800px;display:flex;flex-direction:column;gap:28px">
    <div class="card" style="width:846px;padding:36px 40px;display:flex;align-items:center;gap:30px">
      <div style="width:120px;height:120px;border-radius:32px;background:var(--amarelo);display:grid;place-items:center;box-shadow:0 0 50px rgba(255,196,0,.45)">
        <svg width="58" height="58" viewBox="0 0 24 24" fill="#0F172A"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg></div>
      <div><div style="font:800 44px/1 var(--display)">Salva</div><div class="note" style="color:var(--cinza-2);margin-top:10px">pra revisar na véspera</div></div>
    </div>
    <div class="card" style="width:846px;padding:36px 40px;display:flex;align-items:center;gap:30px">
      ${MARK(120)}
      <div style="flex:1"><div style="font:900 44px/1 var(--display);letter-spacing:-1.5px">bizu <span style="font:800 22px/1 var(--display);letter-spacing:3px;color:var(--amarelo);vertical-align:8px">DO ENEM</span></div>
        <div class="note" style="color:var(--cinza-2);margin-top:10px">um bizu por vídeo</div></div>
      <div class="pill" style="background:var(--roxo);font-size:32px;padding:20px 30px;box-shadow:0 14px 40px rgba(108,59,255,.5)">Seguir</div>
    </div>
  </div>`),
};
document.getElementById('root').innerHTML=frames[F]();
</script>
</body>
</html>
