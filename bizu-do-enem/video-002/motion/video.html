<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bizu do Enem · V002 · Motion</title>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<style>
:root{
  --roxo:#6C3BFF; --roxo-claro:#9C7BFF; --amarelo:#FFC400; --navy:#0F172A; --verde:#3dd6a5;
  --cinza-1:#E7EAF0; --cinza-2:#A9B1C4; --cinza-3:#5B6680;
  --display:"Inter Display","Inter",sans-serif; --texto:"Inter",sans-serif; --mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--texto);color:#fff;
  background:linear-gradient(180deg,#111a30 0%, var(--navy) 55%, #0b1122 100%)}
.glow{position:absolute;border-radius:50%;pointer-events:none;filter:blur(20px)}
#g1{width:1300px;height:1000px;left:220px;top:-200px;background:radial-gradient(closest-side,rgba(108,59,255,.42),transparent)}
#g2{width:1200px;height:1200px;left:-500px;top:1250px;background:radial-gradient(closest-side,rgba(108,59,255,.24),transparent)}
#g3{width:900px;height:900px;left:500px;top:900px;background:radial-gradient(closest-side,rgba(255,196,0,.07),transparent)}
#gridbg{position:absolute;inset:-72px;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 45%,#000 30%,transparent 85%)}
#grain{position:absolute;inset:-120px;pointer-events:none;opacity:.11;mix-blend-mode:overlay;z-index:50;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse 75% 65% at 50% 50%,transparent 55%,rgba(5,8,18,.55) 100%)}
#sweep{position:absolute;left:-400px;top:-200px;width:500px;height:2400px;z-index:48;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(156,123,255,.35),transparent);transform:rotate(12deg)}
section{position:absolute;inset:0;visibility:hidden}
.abs{position:absolute}
.mask{overflow:hidden;padding:0 .06em .1em 0;margin-bottom:-.1em}
.mask>span{display:inline-block}
.h-l{font:900 112px/.95 var(--display);letter-spacing:-4px;white-space:nowrap}
.kicker{font:600 26px/1 var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--roxo-claro)}
.y{color:var(--amarelo)}
.note{font:500 24px/1.2 var(--mono);color:var(--cinza-3);letter-spacing:1px}
#brand{position:absolute;left:84px;top:252px;display:flex;align-items:center;gap:16px;z-index:40}
#brand .word{font:900 36px/1 var(--display);letter-spacing:-1.2px}
#brand .word b{font:800 17px/1 var(--display);letter-spacing:2.4px;color:var(--amarelo);margin-left:8px;vertical-align:6px}
#chapter{position:absolute;right:180px;top:266px;height:26px;overflow:hidden;z-index:40;font:600 24px/26px var(--mono);color:var(--cinza-2);letter-spacing:2px;text-align:right}
#chapter i{font-style:normal;color:var(--amarelo)}
.tok{width:var(--s,64px);height:var(--s,64px);border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.tok svg{width:46%;height:46%}
.tok.ok{background:radial-gradient(circle at 35% 30%,#8d66ff,var(--roxo) 60%,#4f22e0);box-shadow:0 8px 22px rgba(108,59,255,.45),inset 0 2px 0 rgba(255,255,255,.25)}
.tok.err{background:rgba(255,255,255,.03);border:3px solid rgba(169,177,196,.35)}
.tok.warn{background:rgba(255,196,0,.10);border:3px solid var(--amarelo);box-shadow:0 0 30px rgba(255,196,0,.35)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.12);
  border-radius:36px;box-shadow:0 40px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.pill{display:inline-flex;align-items:center;gap:12px;padding:16px 26px;border-radius:999px;font:700 30px/1 var(--display);white-space:nowrap}
#stepper{position:absolute;left:84px;top:350px;display:flex;gap:14px;z-index:30;visibility:hidden}
.step{position:relative;display:flex;align-items:center;gap:12px;padding:12px 20px 12px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);font:700 24px/1 var(--display);color:var(--cinza-2)}
.step .n{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 18px/1 var(--mono);background:rgba(255,255,255,.08)}
.step .n .ck{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:var(--roxo);color:#fff;opacity:0}
.step .on{position:absolute;inset:-1.5px;border-radius:999px;border:1.5px solid var(--amarelo);background:rgba(255,196,0,.10);opacity:0}
.word{display:inline-block;border-radius:8px;padding:0 4px;margin:0 -2px}
</style>
</head>
<body>
<div id="stage">
  <div class="glow" id="g1"></div><div class="glow" id="g2"></div><div class="glow" id="g3"></div>
  <div id="gridbg"></div>
  <div id="brand"></div>
  <div id="chapter"><div id="chapInner"></div></div>
  <div id="stepper"></div>
  <div id="scenes"></div>
  <div id="sweep"></div>
  <div id="vignette"></div><div id="grain"></div>
</div>
<script>
// aleatoriedade determinística: todos os workers de render veem os mesmos valores
Math.random = (()=>{let x=20261027; return ()=>((x=Math.imul(x^(x>>>15),x|1)^(x+Math.imul(x^(x>>>7),x|61)), ((x^(x>>>14))>>>0)/4294967296));})();
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const CHECK=`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg>`;
const CROSS=(c='#A9B1C4')=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const tok=(k,s=64,cls='')=>`<div class="tok ${k} ${cls}" style="--s:${s}px">${k==='ok'?CHECK:k==='warn'?CROSS('#FFC400'):CROSS()}</div>`;
const MARK=(size,{bg='#6C3BFF',fg='#fff',bolt='#FFC400'}={})=>`<svg width="${size}" height="${size}" viewBox="0 0 120 120">
  <rect width="120" height="120" rx="34" fill="${bg}"/><rect x="27" y="20" width="17" height="78" rx="8.5" fill="${fg}"/>
  <circle cx="60" cy="72" r="23" fill="none" stroke="${fg}" stroke-width="17"/>
  <path d="M92 10 L81 29 L90 29 L84 45 L103 24 L93 24 L100 10 Z" fill="${bolt}"/></svg>`;
const mask=(txt,id,cls='')=>`<div class="mask"><span id="${id}" class="${cls}">${txt}</span></div>`;

/* tempo: narração take 1 + pausas aprovadas */
const T=t=>t+(t>2.38?.5:0)+(t>3.94?1.0:0)+(t>5.86?1.0:0)+(t>8.64?.6:0);
const DUR=T(16.858)+1.3;

$('#brand').innerHTML=`${MARK(54)}<div class="word">bizu<b>DO ENEM</b></div>`;
const CHAP=['GANCHO','ERRO 1','ERRO 2','ERRO 3','NA PRÁTICA','CTA'];
$('#chapInner').innerHTML=CHAP.map((c,i)=>`<div><i>0${i+1}</i> / ${c}</div>`).join('');
$('#stepper').innerHTML=['Comando','Tempo','Troca'].map((l,i)=>`<div class="step" id="st${i+1}"><div class="on"></div>
  <span class="n"><span class="num">0${i+1}</span><span class="ck">✓</span></span><span style="position:relative">${l}</span></div>`).join('');

const opts=['A','B','C','D','E'];
const cmdWords='Considerando as informações do texto, é'.split(' ');

$('#scenes').innerHTML=`
<!-- 01 GANCHO -->
<section id="s1">
  <div class="abs" style="inset:0;perspective:1400px">
    <div id="s1plane" class="abs" style="left:-120px;top:1440px;width:1400px;display:flex;flex-wrap:wrap;gap:34px;transform-origin:50% 0">
      ${Array.from({length:84},(_,i)=>tok([9,17,30].includes(i)?'warn':(i*7)%5!==0?'ok':'err',92)).join('')}</div></div>
  <div class="abs" style="left:0;right:0;top:1350px;height:520px;background:linear-gradient(180deg,var(--navy),transparent 60%)"></div>
  <div class="abs" style="left:84px;top:400px"><div class="kicker mask"><span id="s1k">Reta final · ENEM 2026</span></div></div>
  <div id="s1three" class="abs" style="left:56px;top:430px;font:900 560px/1 var(--display);letter-spacing:-30px;color:var(--amarelo);text-shadow:0 0 120px rgba(255,196,0,.35)">3</div>
  <div class="abs" style="left:420px;top:540px;display:flex;flex-direction:column;gap:22px">${[0,1,2].map(()=>tok('warn',92,'s1x')).join('')}</div>
  <div class="abs h-l" style="left:84px;top:1010px">${mask('erros que','s1a')}${mask('podem custar','s1b')}${mask('pontos','s1c','y')}</div>
</section>

<!-- 02 ERRO 1 -->
<section id="s2">
  <div class="abs h-l" style="left:84px;top:450px">${mask('Leia o comando','s2a')}${mask('até o fim','s2b','y')}</div>
  <div class="abs" style="left:0;right:0;top:760px;perspective:1800px">
   <div id="s2card" class="card" style="margin-left:60px;width:870px;padding:44px 46px 40px;transform-origin:20% 50%">
    <div class="note" style="color:var(--roxo-claro);margin-bottom:24px">QUESTÃO 12 · COMANDO</div>
    <div style="font:600 44px/1.45 var(--texto);color:var(--cinza-1)">
      ${cmdWords.map(w=>`<span class="word s2w">${w}</span>`).join(' ')}
      <span id="s2key" style="position:relative;display:inline-block;padding:0 10px;border-radius:10px;font-weight:900">INCORRETO<span id="s2keybg" class="abs" style="inset:0;border-radius:10px;background:var(--amarelo);z-index:-1;box-shadow:0 0 40px rgba(255,196,0,.5)"></span></span>
      <span id="s2rest" style="opacity:.55">afirmar que:</span>
    </div>
    <div id="s2warn" style="margin-top:36px;display:flex;align-items:center;gap:16px">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFC400" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <div style="font:600 30px/1.3 var(--texto);color:var(--cinza-1)">A palavra que muda tudo<br>pode estar <b class="y">no fim</b>.</div>
    </div>
   </div>
  </div>
</section>

<!-- 03 ERRO 2 -->
<section id="s3">
  <div class="abs h-l" style="left:84px;top:450px;font-size:92px">${mask('Não gaste o tempo','s3a')}${mask('numa <span class="y">só questão</span>','s3b')}</div>
  <div id="s3card" class="abs card" style="left:60px;top:800px;width:870px;padding:44px 40px 40px">
    <div style="display:flex;justify-content:space-between;margin-bottom:18px"><div class="note" style="color:var(--roxo-claro)">TEMPO DE PROVA</div>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#A9B1C4" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path id="s3hand" d="M12 13V9" style="transform-origin:12px 13px"/><path d="M10 2h4"/></svg></div>
    <div style="display:flex;height:34px;border-radius:17px;overflow:hidden;background:rgba(255,255,255,.07);margin-bottom:46px">
      <div class="s3seg" style="width:9%;background:var(--roxo);transform-origin:0 50%"></div><div class="s3seg" style="width:6%;background:#5a2fe0;transform-origin:0 50%"></div>
      <div id="s3hog" style="width:68%;transform-origin:0 50%;background:repeating-linear-gradient(135deg,var(--amarelo) 0 14px,#e6b000 14px 28px);background-size:40px 40px;box-shadow:0 0 30px rgba(255,196,0,.5)"></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:26px 0;justify-items:center">
      ${Array.from({length:18},(_,i)=>i<2?`<div class="s3q s3ok">${tok('ok',74)}</div>`:i===2?`<div class="s3q" id="s3stuck" style="position:relative">${tok('warn',74)}
        <svg class="abs" style="left:-16px;top:-16px" width="106" height="106" viewBox="0 0 106 106"><circle cx="53" cy="53" r="49" fill="none" stroke="rgba(255,196,0,.25)" stroke-width="6"/>
        <circle id="s3ring" cx="53" cy="53" r="49" fill="none" stroke="#FFC400" stroke-width="6" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" transform="rotate(-90 53 53)" stroke-linecap="round"/></svg></div>`
        :`<div class="s3q s3wait tok" style="--s:74px;border:3px dashed rgba(169,177,196,.3);font:700 24px/1 var(--mono);color:var(--cinza-3)">${String(i+1).padStart(2,'0')}</div>`).join('')}
    </div>
    <div id="s3tip" style="margin-top:34px;font:600 32px/1.3 var(--texto);color:var(--cinza-1)">Travou? <b class="y">Pule e volte depois.</b></div>
  </div>
</section>

<!-- 04 ERRO 3 -->
<section id="s4">
  <div class="abs h-l" style="left:84px;top:450px;font-size:100px">${mask('Só troque com','s4a')}${mask('motivo concreto','s4b','y')}</div>
  <div id="s4card" class="abs card" style="left:60px;top:800px;width:520px;padding:38px 40px 28px">
    <div class="note" style="color:var(--roxo-claro);margin-bottom:24px">SUA RESPOSTA</div>
    ${opts.map((l,i)=>`<div class="s4row" style="display:flex;align-items:center;gap:18px;margin-bottom:12px">
      <div style="position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:800 24px/1 var(--display);border:2px solid rgba(255,255,255,.2);color:var(--cinza-2)">
        ${i===2?`<div id="s4C" class="abs" style="inset:-2px;border-radius:50%;display:grid;place-items:center;background:var(--amarelo);color:var(--navy);box-shadow:0 0 24px rgba(255,196,0,.5)">C</div>`:''}
        ${i===3?`<div id="s4D" class="abs" style="inset:-2px;border-radius:50%;border:3px dashed var(--amarelo)"></div>`:''}${l}</div>
      <div style="position:relative;height:14px;width:${[60,48,66,52,44][i]}%;border-radius:7px;background:rgba(255,255,255,.12)">
        ${i===2?'<div id="s4Cbar" class="abs" style="inset:0;border-radius:7px;background:rgba(255,196,0,.55);transform-origin:0 50%"></div>':''}</div></div>`).join('')}
  </div>
  <svg id="s4arrow" class="abs" style="left:430px;top:1010px" width="230" height="160" viewBox="0 0 230 160"><path id="s4path" d="M10 40 C 90 0, 170 40, 200 120" stroke="#FFC400" stroke-width="5" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/></svg>
  <div id="s4gate" class="abs card" style="left:600px;top:1100px;width:330px;padding:30px 30px;border-color:rgba(255,196,0,.5)">
    <div style="font:800 34px/1.1 var(--display);margin-bottom:20px">Motivo<br>concreto?</div>
    <div id="s4yes" class="pill" style="font-size:24px;padding:12px 18px;background:rgba(61,214,165,.16);color:var(--verde);margin-bottom:10px">Sim → troca</div>
    <div id="s4no" class="pill" style="font-size:24px;padding:12px 18px;background:rgba(255,255,255,.08);color:var(--cinza-1)">Não → mantém</div>
  </div>
</section>

<!-- 05 NA PRÁTICA -->
<section id="s5">
  <div class="abs" style="left:84px;top:390px"><div class="kicker mask" style="margin-bottom:28px"><span id="s5k">Na prática</span></div>
    <div class="h-l">${mask('Confira.','s5a')}${mask('Justifique.','s5b')}${mask('Marque.','s5c','y')}</div></div>
  <div id="s5card" class="abs card" style="left:60px;top:900px;width:870px;padding:40px 44px 34px">
    ${[['Enunciado conferido','li até o fim, achei a palavra-chave'],['Escolha justificada','sei dizer por que é a C']].map(([a,b],k)=>`
    <div class="s5item" style="display:flex;align-items:center;gap:22px;margin-bottom:26px">
      <div style="position:relative;width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.2);flex:none"><div class="s5ck abs" style="inset:-3px">${tok('ok',64)}</div></div>
      <div><div style="font:800 36px/1.1 var(--display)">${a}</div><div class="note" style="color:var(--cinza-2);margin-top:8px">${b}</div></div></div>`).join('')}
    <div style="height:1.5px;background:rgba(255,255,255,.1);margin:8px 0 28px"></div>
    <div style="display:flex;gap:18px;align-items:center">
      ${opts.map((l,i)=>`<div style="position:relative;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font:800 32px/1 var(--display);border:2.5px solid rgba(255,255,255,.2);color:var(--cinza-2)">${l}
        ${i===2?'<div id="s5fill" class="abs" style="inset:-2.5px;border-radius:50%;display:grid;place-items:center;background:var(--amarelo);color:var(--navy);box-shadow:0 0 34px rgba(255,196,0,.55)">C</div>':''}</div>`).join('')}
      <div id="s5now" style="margin-left:10px;font:700 30px/1 var(--display);color:var(--amarelo)">← agora sim</div>
    </div>
  </div>
</section>

<!-- 06 CTA -->
<section id="s6">
  <div class="abs" style="left:84px;top:390px"><div class="kicker mask" style="margin-bottom:28px"><span id="s6k">Curtiu o bizu?</span></div>
    <div class="h-l">${mask('Salva','s6a')}${mask('e segue','s6b','y')}</div></div>
  <div class="abs" style="left:84px;top:800px;display:flex;flex-direction:column;gap:28px">
    <div id="s6save" class="card" style="width:846px;padding:36px 40px;display:flex;align-items:center;gap:30px">
      <div id="s6icon" style="width:120px;height:120px;border-radius:32px;background:var(--amarelo);display:grid;place-items:center;box-shadow:0 0 50px rgba(255,196,0,.45)">
        <svg width="58" height="58" viewBox="0 0 24 24" fill="#0F172A"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg></div>
      <div><div style="font:800 44px/1 var(--display)">Salva</div><div class="note" style="color:var(--cinza-2);margin-top:10px">pra revisar na véspera</div></div>
    </div>
    <div id="s6follow" class="card" style="width:846px;padding:36px 40px;display:flex;align-items:center;gap:30px">
      ${MARK(120)}
      <div style="flex:1"><div style="font:900 44px/1 var(--display);letter-spacing:-1.5px">bizu <span style="font:800 22px/1 var(--display);letter-spacing:3px;color:var(--amarelo);vertical-align:8px">DO ENEM</span></div>
        <div class="note" style="color:var(--cinza-2);margin-top:10px">um bizu por vídeo</div></div>
      <div id="s6btn" class="pill" style="background:var(--roxo);font-size:32px;padding:20px 30px;box-shadow:0 14px 40px rgba(108,59,255,.5)">Seguir</div>
    </div>
  </div>
</section>`;

/* medidas: tokens ✕ do gancho → números do stepper */
$$('section').forEach(s=>s.style.visibility='visible'); $('#stepper').style.visibility='visible';
const C=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width}};
const xs=$$('.s1x'), nums=$$('.step .n');
const x2n=xs.map((t,i)=>{const a=C(t),b=C(nums[i]);return{x:b.x-a.x,y:b.y-a.y,s:b.w/a.w}});
$$('section').forEach(s=>s.style.visibility=''); $('#stepper').style.visibility='';

/* ============ TIMELINE ============ */
gsap.defaults({ease:'power3.out',duration:.6});
const tl=gsap.timeline({paused:true});
const show=(sel,t0,t1)=>{tl.set(sel,{visibility:'visible'},t0); if(t1!=null) tl.set(sel,{visibility:'hidden'},t1);};
const up=(sel,t,o={})=>tl.from(sel,{yPercent:110,duration:.7,ease:'expo.out',...o},t);
const out=(sel,t,o={})=>tl.to(sel,{yPercent:-110,duration:.42,ease:'power3.in',...o},t);
const chap=(i,t)=>tl.to('#chapInner',{y:-26*i,duration:.5,ease:'power3.inOut'},t);
const sweep=t=>{tl.fromTo('#sweep',{x:0},{x:1700,duration:.55,ease:'power2.inOut',immediateRender:false},t);
  tl.fromTo('#sweep',{opacity:0},{opacity:1,duration:.27,yoyo:true,repeat:1,ease:'sine.inOut',immediateRender:false},t);};
const stepOn=(i,t)=>tl.to(`#st${i} .on`,{opacity:1,duration:.3},t).to(`#st${i}`,{color:'#fff',duration:.3},t)
  .to(`#st${i} .n`,{backgroundColor:'#FFC400',color:'#0F172A',duration:.3},t)
  .fromTo(`#st${i}`,{scale:1},{scale:1.08,duration:.18,yoyo:true,repeat:1,ease:'power2.out',immediateRender:false},t);
const stepDone=(i,t)=>tl.to(`#st${i} .on`,{opacity:0,duration:.3},t).to(`#st${i}`,{color:'#A9B1C4',duration:.3},t)
  .fromTo(`#st${i} .ck`,{opacity:0,scale:0},{opacity:1,scale:1,duration:.35,ease:'back.out(3)',immediateRender:false},t);

tl.fromTo('#g1',{x:0,y:0},{x:-260,y:180,duration:DUR,ease:'sine.inOut'},0);
tl.fromTo('#g2',{x:0,y:0},{x:380,y:-260,duration:DUR,ease:'sine.inOut'},0);
tl.fromTo('#g3',{x:0,y:0,opacity:.4},{x:-420,y:-200,opacity:1,duration:DUR,ease:'sine.inOut'},0);
tl.fromTo('#gridbg',{y:0},{y:72,duration:DUR,ease:'none'},0);
tl.fromTo('#scenes',{scale:1},{scale:1.035,duration:DUR,ease:'sine.inOut',transformOrigin:'50% 45%'},0);
tl.from('#brand',{opacity:0,x:-30,duration:.6},0.05);
tl.from('#chapter',{opacity:0,duration:.5},0.2);

/* ---- 01 GANCHO: 0 → 2.85 ---- */
show('#s1',0,3.05);
tl.fromTo('#s1plane',{rotationX:78,rotationZ:-8,y:420,opacity:0},{rotationX:62,y:0,opacity:.85,duration:1.6,ease:'expo.out'},0);
tl.to('#s1plane',{y:-30,rotationZ:-6,duration:1.4,ease:'sine.inOut'},1.6);
tl.from('#s1three',{scale:2.4,opacity:0,rotation:-8,transformOrigin:'40% 60%',duration:.55,ease:'back.out(1.6)'},0.0);
up('#s1k',0.1);
tl.from('.s1x',{scale:0,rotation:-120,duration:.45,ease:'back.out(2.6)',stagger:.12},T(0.40));
up('#s1a',T(0.40)); up('#s1b',T(0.69)); up('#s1c',T(1.30),{color:'#fff'});
tl.to('#s1c',{color:'#FFC400',duration:.25},T(1.45));
// saída: os três ✕ voam até o stepper e viram 01·02·03
const s1out=T(2.30);
tl.to('#s1three',{scale:.2,opacity:0,x:-40,y:-260,duration:.45,ease:'power3.in'},s1out);
out(['#s1k','#s1a','#s1b','#s1c'],s1out,{stagger:.03});
tl.to('#s1plane',{rotationX:0,y:-1700,opacity:0,duration:.6,ease:'power3.in'},s1out);
xs.forEach((t,i)=>tl.to(t,{x:x2n[i].x,y:x2n[i].y,scale:x2n[i].s,duration:.55,ease:'power3.inOut'},s1out+.05+i*.04));
tl.set('#stepper',{visibility:'visible'},s1out+.62);
tl.from('.step',{opacity:0,duration:.2,stagger:.04},s1out+.6);
tl.set('.s1x',{opacity:0},s1out+.7);

/* ---- 02 ERRO 1: comando até o fim ---- */
const s2in=2.62;
const s2out=T(3.94)+.62;
show('#s2',s2in,s2out+.45); chap(1,s2in);
stepOn(1,s2in+.05);
up('#s2a',T(2.50)); up('#s2b',T(3.15),{color:'#fff'}); tl.to('#s2b',{color:'#FFC400',duration:.25},T(3.40));
tl.set('#s2card',{rotationY:-8,rotationX:5},0);
tl.from('#s2card',{y:220,opacity:0,rotationX:-25,duration:.8,ease:'expo.out'},s2in+.08);
// marca-texto palavra a palavra, de "comando" até "fim"
tl.fromTo('.s2w',{backgroundColor:'rgba(108,59,255,0)'},{backgroundColor:'rgba(108,59,255,.55)',duration:.12,stagger:(T(3.40)-T(2.78))/cmdWords.length,ease:'none'},T(2.78));
tl.from('#s2keybg',{scaleX:0,transformOrigin:'0 50%',duration:.25,ease:'power3.out'},T(3.45));
tl.fromTo('#s2key',{color:'#E7EAF0'},{color:'#0F172A',duration:.15},T(3.50));
tl.fromTo('#s2key',{scale:1},{scale:1.12,duration:.2,yoyo:true,repeat:1,ease:'power2.out',immediateRender:false},T(3.50));
tl.from('#s2rest',{opacity:0,duration:.4},T(3.70));
tl.from('#s2warn',{opacity:0,y:20,duration:.45},T(3.75));
out(['#s2a','#s2b'],s2out,{stagger:.04});
tl.to('#s2card',{y:-60,opacity:0,scale:.95,duration:.4,ease:'power3.in'},s2out);

/* ---- 03 ERRO 2: tempo ---- */
const s3in=s2out+.30, s3out=T(5.86)+.66;
show('#s3',s3in,s3out+.45); chap(2,s3in);
stepDone(1,s3in); stepOn(2,s3in+.08);
up('#s3a',T(4.03)); up('#s3b',T(5.10));
tl.from('#s3card',{y:200,opacity:0,rotationX:-20,transformPerspective:1600,duration:.8,ease:'expo.out'},s3in+.05);
tl.from('.s3q',{scale:0,duration:.3,ease:'back.out(2.5)',stagger:.02},s3in+.2);
tl.from('.s3seg',{scaleX:0,duration:.35,stagger:.2},s3in+.35);
tl.fromTo('#s3hog',{scaleX:0},{scaleX:1,duration:T(5.77)-T(4.55),ease:'power1.in'},T(4.55));
tl.fromTo('#s3hog',{backgroundPosition:'0px 0px'},{backgroundPosition:'200px 0px',duration:2.6,ease:'none'},T(4.55));
tl.to('#s3ring',{attr:{'stroke-dashoffset':0},duration:T(5.77)-T(4.55),ease:'power1.in'},T(4.55));
tl.to('#s3hand',{rotation:720,duration:T(5.77)-T(4.55),ease:'power1.in'},T(4.55));
tl.fromTo('#s3stuck',{x:0},{x:4,duration:.05,repeat:9,yoyo:true,ease:'none',immediateRender:false},T(5.40));
tl.to('.s3wait',{opacity:.3,duration:.5},T(5.30));
tl.from('#s3tip',{opacity:0,y:20,duration:.45},T(5.55));
out(['#s3a','#s3b'],s3out,{stagger:.04});
tl.to('#s3card',{y:-60,opacity:0,scale:.95,duration:.4,ease:'power3.in'},s3out);

/* ---- 04 ERRO 3: troca ---- */
const s4in=s3out+.30, s4out=T(8.64)+.30;
show('#s4',s4in,s4out+.5); chap(3,s4in);
stepDone(2,s4in); stepOn(3,s4in+.08);
up('#s4a',T(6.10)); up('#s4b',T(7.50),{color:'#fff'}); tl.to('#s4b',{color:'#FFC400',duration:.25},T(7.85));
tl.from('#s4card',{x:-120,opacity:0,duration:.7,ease:'expo.out'},s4in+.05);
tl.from('.s4row',{opacity:0,x:-20,duration:.3,stagger:.05},s4in+.15);
tl.from('#s4C',{scale:0,duration:.35,ease:'back.out(3)'},s4in+.45);
tl.from('#s4Cbar',{scaleX:0,duration:.4},s4in+.5);
tl.from('#s4path',{attr:{'stroke-dashoffset':1},duration:.55,ease:'power2.inOut'},T(6.30));
tl.from('#s4D',{opacity:0,scale:1.6,duration:.35,ease:'back.out(2)'},T(6.70));
tl.from('#s4gate',{opacity:0,y:40,scale:.9,duration:.5,ease:'back.out(1.8)'},T(7.25));
tl.from(['#s4yes','#s4no'],{opacity:0,x:20,duration:.3,stagger:.1},T(7.45));
// sem motivo concreto: mantém
tl.to('#s4no',{backgroundColor:'#FFC400',color:'#0F172A',duration:.25},T(8.10));
tl.fromTo('#s4no',{scale:1},{scale:1.1,duration:.18,yoyo:true,repeat:1,immediateRender:false},T(8.10));
tl.to('#s4yes',{opacity:.35,duration:.3},T(8.10));
tl.to('#s4path',{attr:{'stroke-dashoffset':-1},duration:.4,ease:'power2.in'},T(8.20));
tl.to('#s4D',{opacity:0,scale:.6,duration:.3},T(8.25));
tl.fromTo('#s4C',{scale:1},{scale:1.2,duration:.2,yoyo:true,repeat:1,immediateRender:false},T(8.35));
stepDone(3,T(8.40));
out(['#s4a','#s4b'],s4out,{stagger:.04});
tl.to(['#s4card','#s4gate','#s4arrow'],{y:-60,opacity:0,duration:.4,ease:'power3.in'},s4out);
tl.to('#stepper',{y:-40,opacity:0,duration:.4,ease:'power3.in'},s4out+.1);
sweep(s4out+.05);

/* ---- 05 NA PRÁTICA ---- */
const s5in=s4out+.35, s5out=15.98;
show('#s5',s5in,s5out+.45); chap(4,s5in);
up('#s5k',T(8.75));
up('#s5a',T(9.62)); up('#s5b',T(10.88)); up('#s5c',T(12.44),{color:'#fff'}); tl.to('#s5c',{color:'#FFC400',duration:.25},T(12.55));
tl.from('#s5card',{y:200,opacity:0,duration:.8,ease:'expo.out'},s5in+.15);
tl.from('.s5item',{opacity:0,x:-30,duration:.4,stagger:.12},s5in+.3);
tl.set('.s5ck',{scale:0},0);
tl.to('.s5ck',{scale:1,duration:.35,ease:'back.out(3)',stagger:T(11.58)-T(10.2)},T(10.20));
tl.from('#s5fill',{scale:0,duration:.4,ease:'back.out(2.5)'},T(12.50));
tl.from('#s5now',{opacity:0,x:-20,duration:.35},T(12.70));
out(['#s5k','#s5a','#s5b','#s5c'],s5out,{stagger:.03,duration:.32});
tl.to('#s5card',{y:-60,opacity:0,duration:.4,ease:'power3.in'},s5out);

/* ---- 06 CTA ---- */
const s6in=16.30;
show('#s6',s6in,DUR+1); chap(5,s6in);
up('#s6k',s6in+.05); up('#s6a',16.42);
tl.from('#s6save',{x:-200,opacity:0,duration:.6,ease:'expo.out'},T(13.25));
tl.fromTo('#s6icon',{scale:1},{scale:1.15,duration:.2,yoyo:true,repeat:1,ease:'power2.out',immediateRender:false},T(13.70));
up('#s6b',T(14.55),{color:'#fff'}); tl.to('#s6b',{color:'#FFC400',duration:.25},T(14.70));
tl.from('#s6follow',{x:-200,opacity:0,duration:.6,ease:'expo.out'},T(14.60));
tl.fromTo('#s6btn',{scale:1},{scale:1.12,duration:.22,yoyo:true,repeat:1,ease:'power2.out',immediateRender:false},T(15.05));
tl.fromTo('#s6btn',{scale:1},{scale:1.08,duration:.22,yoyo:true,repeat:1,ease:'power2.out',immediateRender:false},T(16.40));
tl.to('#brand',{scale:1.08,transformOrigin:'0 50%',duration:.3,yoyo:true,repeat:1,ease:'power2.out'},T(15.10));
tl.to({},{duration:DUR},0);

function post(t){
  const f=Math.floor(t*24), r=(Math.sin(f*12.9898)*43758.5453)%1;
  document.getElementById('grain').style.transform=`translate(${(r*120)|0}px,${((r*7.31%1)*120)|0}px)`;
}
window.DUR=DUR;
window.renderAt=t=>{tl.seek(t,false);post(t);};
window.renderAt(0);
</script>
</body>
</html>
