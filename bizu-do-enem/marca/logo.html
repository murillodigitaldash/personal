<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bizu do Enem · Marca</title>
<style>
:root{--roxo:#6C3BFF;--amarelo:#FFC400;--navy:#0F172A;--branco:#fff;--cinza:#A9B1C4}
*{margin:0;padding:0;box-sizing:border-box}
body{width:2000px;height:1250px;background:#0B1122;font-family:"Inter",sans-serif;color:#fff;padding:70px}
h1{font:800 44px/1 "Inter Display";letter-spacing:-1px}
.sub{font:400 22px/1 "JetBrains Mono";color:var(--cinza);margin:16px 0 50px}
.grid{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:470px 470px;gap:40px}
.panel{border-radius:28px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.panel .lab{position:absolute;left:28px;top:24px;font:500 18px/1 "JetBrains Mono";letter-spacing:2px;opacity:.6}
.dark{background:radial-gradient(700px 400px at 70% 20%,rgba(108,59,255,.35),transparent 70%),var(--navy)}
.light{background:#F3F4F8;color:var(--navy)}
.roxo{background:var(--roxo)}
.icons{display:flex;gap:46px;align-items:flex-end}
</style>
</head>
<body>
<h1>Bizu do Enem · proposta de marca v1</h1>
<div class="sub">símbolo "token-bizu": o círculo de item do vídeo + o raio do bizu · Inter Display Black</div>
<div class="grid">
  <div class="panel dark"><span class="lab">ASSINATURA PRINCIPAL</span><div id="h1"></div></div>
  <div class="panel light"><span class="lab">FUNDO CLARO</span><div id="h2"></div></div>
  <div class="panel roxo"><span class="lab">FUNDO DE MARCA</span><div id="h3"></div></div>
  <div class="panel dark"><span class="lab">SÍMBOLO · ÍCONE DE PERFIL · FAVICON</span><div class="icons" id="ic"></div></div>
</div>
<script>
// Símbolo: squircle roxo + "b" minúsculo construído geometricamente + raio amarelo saindo do bojo
function mark(size, {bg='#6C3BFF', fg='#FFFFFF', bolt='#FFC400', ring=false}={}){
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120">
    <rect x="0" y="0" width="120" height="120" rx="34" fill="${bg}"/>
    ${ring?'<rect x="1.5" y="1.5" width="117" height="117" rx="32.5" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="3"/>':''}
    <!-- haste do b -->
    <rect x="27" y="20" width="17" height="78" rx="8.5" fill="${fg}"/>
    <!-- bojo do b: anel -->
    <circle cx="60" cy="72" r="23" fill="none" stroke="${fg}" stroke-width="17"/>
    <!-- raio do bizu -->
    <path d="M92 10 L81 29 L90 29 L84 45 L103 24 L93 24 L100 10 Z" fill="${bolt}"/>
  </svg>`;
}
function lockup(scale, {word='#FFFFFF', accent='#FFC400', markOpts={}}={}){
  const s=scale;
  return `<div style="display:flex;align-items:center;gap:${22*s}px">
    ${mark(120*s, markOpts)}
    <div style="display:flex;flex-direction:column;gap:${6*s}px">
      <div style="font:900 ${96*s}px/.82 'Inter Display';letter-spacing:${-4*s}px;color:${word}">bizu</div>
      <div style="font:800 ${30*s}px/1 'Inter Display';letter-spacing:${5*s}px;color:${accent};padding-left:${4*s}px">DO ENEM</div>
    </div></div>`;
}
h1.innerHTML = lockup(2.0);
h2.innerHTML = lockup(1.55,{word:'#0F172A',accent:'#6C3BFF'});
h3.innerHTML = lockup(1.55,{accent:'#FFC400',markOpts:{bg:'#0F172A'}});
ic.innerHTML = mark(260,{ring:true}) + `<div style="width:200px;height:200px;border-radius:50%;overflow:hidden">${mark(200)}</div>` + mark(96) + mark(48);
window.MARK = mark; window.LOCKUP = lockup;
</script>
</body>
</html>
