<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bizu do Enem · V009 · Motion</title>
<link rel="stylesheet" href="../../shared/base.css">
<link rel="stylesheet" href="../../shared/motion.css">
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<style>
.map{position:absolute;left:60px;width:870px;border-radius:30px;overflow:hidden;background:#E9F5EC;box-shadow:0 40px 90px rgba(0,0,0,.45)}
.map svg{display:block}
.city{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.city i{width:30px;height:30px;border-radius:50%;background:#6C3BFF;border:5px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.city b{font:800 24px/1 var(--display);color:#0F172A;background:#fff;padding:6px 12px;border-radius:10px}
.sc{position:absolute;right:22px;bottom:20px;font:800 26px/1 var(--mono);color:#0F172A;background:#fff;padding:10px 16px;border-radius:12px}
.ruler{position:absolute;height:46px;background:#FFC400;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.3);overflow:hidden}
.ruler .t{position:absolute;bottom:0;width:3px;background:#0F172A}
.calc{font:800 46px/1.15 var(--mono);letter-spacing:-1px}
.calc .z{display:inline-block;position:relative}
.calc .z s{position:absolute;left:-2px;right:-2px;top:50%;height:5px;background:#FF7A8A;transform-origin:0 50%;text-decoration:none}
.pills{display:flex;gap:12px}
.ap{position:relative;flex:1;text-align:center;padding:18px 0 16px;border-radius:20px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.ap .l{font:700 18px/1 var(--mono);color:var(--cinza-2);display:block;margin-bottom:10px}
.ap .v{font:800 30px/1 var(--display);white-space:nowrap;letter-spacing:-.5px}
.ap .n{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);white-space:nowrap;font:600 18px/1.2 var(--mono);color:#FF7A8A;text-align:center}
.mini{flex:1;border-radius:24px;overflow:hidden;background:#E9F5EC;position:relative;height:330px}
.mini .lab{position:absolute;left:16px;top:14px;font:800 24px/1 var(--mono);color:#0F172A;background:#fff;padding:8px 12px;border-radius:10px}
</style>
</head>
<body>
<div id="stage"><div id="scenes"></div></div>
<script src="../../shared/kit.js"></script>
<script src="../../shared/motion.js"></script>
<script>
const {ctaFollow} = KIT;
/* tempo: narração take 1 + pausa de +1,5 s após "Qual a distância real?" (alternativas na tela) */
const T = t => t + (t > 19.38 ? 1.5 : 0);
const DUR = T(44.629) + 1.3;
const {tl, show, up, out, chap, sweep, pulse, mask, $, $$} = MOTION.init({chapters:['GANCHO','CONCEITO','APLICAÇÃO','O BIZU','CTA'], dur:DUR});

// mapa estilizado (ruas, rio, parque) reutilizado nas cenas
const terrain = (w,h,detail) => `<svg width="${w}" height="${h}" viewBox="0 0 870 420" preserveAspectRatio="xMidYMid slice">
  <rect width="870" height="420" fill="#E9F5EC"/>
  <path d="M-20 300 C 150 250, 260 360, 430 300 S 720 220, 900 280" stroke="#7CC6F0" stroke-width="${detail?26:16}" fill="none"/>
  <ellipse cx="700" cy="110" rx="120" ry="70" fill="#BFE3C6"/><ellipse cx="160" cy="120" rx="90" ry="55" fill="#BFE3C6"/>
  ${detail?[...Array(9)].map((_,i)=>`<path d="M${i*100+20} 0 V420" stroke="#fff" stroke-width="10"/>`).join('')+[...Array(5)].map((_,i)=>`<path d="M0 ${i*90+30} H870" stroke="#fff" stroke-width="10"/>`).join('')
         :`<path d="M0 200 Q 430 150 870 210" stroke="#fff" stroke-width="10" fill="none"/>`}
  ${detail?[...Array(14)].map((_,i)=>`<rect x="${(i%7)*120+40}" y="${Math.floor(i/7)*170+50}" width="46" height="34" rx="4" fill="#D9D3F5"/>`).join(''):''}
</svg>`;
const ALTS=[['A','2 km','cortou 6 zeros'],['B','20 km',''],['C','200 km','cortou 4 zeros'],['D','2.000 km',''],['E','0,2 km','']];

$('#scenes').innerHTML=`
<section id="s1">
  <div class="abs" style="left:84px;top:390px"><div class="kicker mask" style="margin-bottom:28px"><span id="s1k">Geografia · Escala</span></div>
    <div class="h-l nowrap">${mask('Escala:','s1a')}${mask('a conta','s1b')}${mask('de cabeça','s1c','y')}</div></div>
  <div id="s1map" class="map" style="top:870px;height:420px">${terrain(870,420,false)}
    <div class="city" style="left:180px;top:200px"><i></i><b>Cidade A</b></div><div class="city" style="left:690px;top:230px"><i></i><b>Cidade B</b></div>
    <svg class="abs" style="left:0;top:0" width="870" height="420"><path id="s1path" d="M180 200 L690 230" stroke="#6C3BFF" stroke-width="6" stroke-dasharray="14 12" fill="none"/></svg>
    <div class="sc">1 : 500.000</div></div>
</section>

<section id="s2">
  <div class="abs" style="left:84px;top:390px"><div class="kicker mask" style="margin-bottom:28px"><span id="s2k">O que a escala diz</span></div>
    <div class="h-l nowrap" style="font-size:150px;letter-spacing:-5px">${mask('1 : <span class="y">500.000</span>','s2a')}</div></div>
  <div class="abs" style="left:60px;top:720px;width:870px;display:flex;flex-direction:column;gap:26px">
    <div class="card" id="s2m" style="padding:36px 40px;display:flex;align-items:center;gap:30px">
      <div style="position:relative;width:150px;height:50px;background:#FFC400;border-radius:8px;flex:none"><div class="abs" style="left:0;bottom:0;width:3px;height:26px;background:#0F172A"></div><div class="abs" style="right:0;bottom:0;width:3px;height:26px;background:#0F172A"></div></div>
      <div><div style="font:900 64px/1 var(--display)">1 cm</div><div class="note" style="margin-top:10px;color:var(--cinza-2)">no mapa</div></div></div>
    <div id="s2eq" style="font:900 70px/1 var(--display);color:var(--amarelo);padding-left:56px">vale</div>
    <div class="card" id="s2t" style="padding:36px 40px;display:flex;align-items:center;gap:30px">
      <svg width="150" height="90" viewBox="0 0 150 90"><path d="M0 70 L40 30 L70 55 L105 15 L150 70 Z" fill="#3dd6a5" opacity=".8"/><path d="M0 70 H150" stroke="#fff" stroke-width="4"/></svg>
      <div><div style="font:900 64px/1 var(--display)">500.000 cm</div><div class="note" style="margin-top:10px;color:var(--cinza-2)">no terreno · 5 km</div></div></div>
  </div>
</section>

<section id="s3">
  <div class="abs" style="left:84px;top:380px"><div style="position:relative;height:60px;width:900px">
    <div class="abs kicker mask" style="left:0;top:0"><span id="s3k">Vamos aplicar</span></div>
    <div class="abs kicker mask" style="left:0;top:0;color:var(--amarelo)"><span id="s3k2">Qual a distância real?</span></div>
    <div class="abs kicker mask" style="left:0;top:0;color:#FF7A8A"><span id="s3k3">⚠ A armadilha: os zeros</span></div></div></div>
  <div id="s3map" class="map" style="top:460px;height:330px">${terrain(870,330,false)}
    <div class="city" style="left:170px;top:150px"><i></i><b>A</b></div><div class="city" style="left:650px;top:150px"><i></i><b>B</b></div>
    <div id="ruler" class="ruler" style="left:170px;top:210px;width:480px">${[...Array(41)].map((_,i)=>`<div class="t" style="left:${i*12-1}px;height:${i%10===0?26:i%5===0?18:10}px"></div>`).join('')}
      ${[0,1,2,3,4].map(i=>`<div class="abs" style="left:${i*120+6}px;top:4px;font:800 16px/1 var(--mono);color:#0F172A">${i}</div>`).join('')}</div>
    <div id="s3cm" class="abs" style="left:330px;top:270px;font:900 34px/1 var(--display);color:#0F172A;background:#fff;padding:8px 16px;border-radius:12px">4 cm</div>
    <div class="sc">1 : 500.000</div></div>
  <div id="s3calc" class="abs card" style="left:60px;top:820px;width:870px;padding:30px 36px">
    <div class="calc" id="c1">4 × 500.000 =</div>
    <div class="calc" id="c2" style="color:var(--amarelo)">2.000.000 cm</div>
    <div class="calc" id="c3" style="margin-top:14px;font-size:38px;color:var(--cinza-2)">cm → km: ÷ 100.000</div>
    <div class="calc" id="c4" style="margin-top:10px;font-size:64px">= <span class="y">20 km</span></div>
  </div>
  <div id="s3alts" class="abs" style="left:60px;top:1290px;width:870px"><div class="pills">
    ${ALTS.map(([l,v,n])=>`<div class="ap" id="a${l}"><span class="l">${l}</span><span class="v">${v}</span>${n?`<span class="n aNote">${n}</span>`:''}</div>`).join('')}</div></div>
</section>

<section id="s4">
  <div class="abs" style="left:84px;top:390px"><div class="kicker mask" style="margin-bottom:28px;color:var(--amarelo)"><span id="s4k">O bizu</span></div>
    <div style="position:relative;height:330px;width:920px">
      <div class="abs h-l nowrap" style="left:0;top:0;font-size:96px">${mask('Multiplique e','s4a')}${mask('corte <span class="y">5 zeros</span>','s4b')}</div>
      <div class="abs h-l nowrap" style="left:0;top:0;font-size:88px">${mask('Denominador maior','s4c')}${mask('= <span class="y">menos detalhe</span>','s4d')}</div>
    </div></div>
  <div id="s4z" class="abs card" style="left:60px;top:800px;width:870px;padding:40px;text-align:center">
    <div class="calc" style="font-size:80px">2.0<span class="z" id="z0">0<s></s></span><span class="z" id="z1">0<s></s></span>.<span class="z" id="z2">0<s></s></span><span class="z" id="z3">0<s></s></span><span class="z" id="z4">0<s></s></span> cm</div>
    <div class="calc" id="s4r" style="font-size:72px;margin-top:20px">= <span class="y">20 km</span></div>
  </div>
  <div id="s4maps" class="abs" style="left:60px;top:800px;width:870px;display:flex;gap:24px">
    <div class="mini" id="mA">${terrain(423,330,true)}<div class="lab">1 : 10.000</div>
      <div class="abs pill" style="left:16px;bottom:16px;background:var(--roxo);font-size:24px">mais detalhe</div></div>
    <div class="mini" id="mB">${terrain(423,330,false)}<div class="lab">1 : 1.000.000</div>
      <div class="abs pill" style="left:16px;bottom:16px;background:#0F172A;font-size:24px">menos detalhe</div></div>
  </div>
</section>

<section id="s5">
  <div class="abs" style="left:84px;top:390px"><div class="kicker mask" style="margin-bottom:28px"><span id="s5k">Curtiu o bizu?</span></div>
    <div class="h-l">${mask('Salva','s5a')}${mask('e segue','s5b','y')}</div></div>
  <div id="s5cards" class="abs" style="left:84px;top:800px;display:flex;flex-direction:column;gap:28px">${ctaFollow('pra revisar antes da prova')}</div>
</section>`;

/* 01 GANCHO: 0 → 4.6 */
show('#s1',0,5.0);
up('#s1k',.05); up('#s1a',0); up('#s1b',T(2.55)); up('#s1c',T(3.19),{color:'#fff'}); tl.to('#s1c',{color:'#FFC400',duration:.25},T(3.39));
tl.from('#s1map',{y:200,opacity:0,rotationX:-16,transformPerspective:1600,duration:.9,ease:'expo.out'},.4);
tl.from('#s1map .city',{scale:0,duration:.4,ease:'back.out(2)',stagger:.15},1.0);
tl.fromTo('#s1path',{strokeDashoffset:600},{strokeDashoffset:0,duration:1.2,ease:'power2.inOut',immediateRender:false},1.4);
tl.set('#s1path',{strokeDashoffset:600},0);
out(['#s1k','#s1a','#s1b','#s1c'],4.5,{stagger:.03}); tl.to('#s1map',{y:-60,opacity:0,duration:.4,ease:'power3.in'},4.5);

/* 02 CONCEITO */
const s2in=4.7, s2out=T(11.25);
show('#s2',s2in,s2out+.5); chap(1,s2in);
up('#s2k',T(4.78)); up('#s2a',T(5.43)); pulse('#s2a',T(6.3),1.05);
tl.from('#s2m',{x:-160,opacity:0,duration:.55,ease:'expo.out'},T(7.53));
tl.from('#s2eq',{opacity:0,y:20,duration:.35},T(8.99));
tl.from('#s2t',{x:-160,opacity:0,duration:.55,ease:'expo.out'},T(9.29));
out(['#s2k','#s2a'],s2out,{stagger:.03}); tl.to(['#s2m','#s2eq','#s2t'],{y:-50,opacity:0,duration:.35,stagger:.04,ease:'power3.in'},s2out);
sweep(s2out+.05);

/* 03 APLICAÇÃO */
const s3in=T(11.4), s3out=T(31.62);
show('#s3',s3in,s3out+.5); chap(2,s3in);
up('#s3k',T(11.44));
tl.from('#s3map',{y:180,opacity:0,duration:.8,ease:'expo.out'},T(12.4));
tl.from('#s3map .city',{scale:0,duration:.4,ease:'back.out(2)',stagger:.2},T(14.85));
tl.from('#ruler',{scaleX:0,transformOrigin:'0 50%',duration:.9,ease:'power2.inOut'},T(16.0));
tl.from('#s3cm',{opacity:0,y:16,scale:.8,duration:.35,ease:'back.out(2)'},T(16.6));
out('#s3k',T(18.15),{duration:.3}); up('#s3k2',T(18.25));
// alternativas (pausa de 1,5 s)
tl.from('#s3alts .ap',{opacity:0,y:30,duration:.35,stagger:.07,ease:'back.out(1.6)'},T(18.9));
tl.set('.aNote',{opacity:0},0);
tl.set(['#c1','#c2','#c3','#c4'],{opacity:0},0);
tl.from('#s3calc',{y:100,opacity:0,duration:.6,ease:'expo.out'},T(19.4));
tl.to('#c1',{opacity:1,duration:.3},T(19.52)); tl.fromTo('#c2',{opacity:0,x:-30},{opacity:1,x:0,duration:.35,immediateRender:false},T(21.24)); pulse('#c2',T(21.5),1.05);
tl.to('#c3',{opacity:1,duration:.3},T(24.17)); pulse('#c3',T(26.45),1.04);
tl.fromTo('#c4',{opacity:0,scale:.8},{opacity:1,scale:1,transformOrigin:'0 50%',duration:.4,ease:'back.out(2)',immediateRender:false},T(28.1));
tl.to('#aB',{borderColor:'#FFC400',background:'rgba(255,196,0,.15)',duration:.3},T(28.1)); pulse('#aB',T(28.1),1.08);
out('#s3k2',T(29.15),{duration:.3}); up('#s3k3',T(29.25));
tl.to(['#aA','#aC'],{borderColor:'#FF7A8A',duration:.3,stagger:.2},T(30.75));
tl.to('#s3alts .aNote',{opacity:1,duration:.3,stagger:.2},T(30.85));
tl.to(['#aD','#aE'],{opacity:.4,duration:.3},T(30.9));
out('#s3k3',s3out,{duration:.3});
tl.to(['#s3map','#s3calc','#s3alts'],{y:-60,opacity:0,duration:.4,stagger:.04,ease:'power3.in'},s3out);

/* 04 BIZU */
const s4in=T(31.72), s4out=T(41.8);
show('#s4',s4in,s4out+.5); chap(3,s4in);
up('#s4k',T(31.74)); up('#s4a',T(32.5)); up('#s4b',T(34.31));
tl.from('#s4z',{y:120,opacity:0,duration:.6,ease:'expo.out'},T(32.6));
tl.set('.calc .z s',{scaleX:0},0); tl.set('#s4r',{opacity:0},0);
tl.to('.calc .z s',{scaleX:1,duration:.22,stagger:.12,ease:'power3.inOut'},T(34.67));
tl.to('.calc .z',{opacity:.35,duration:.2,stagger:.12},T(34.75));
tl.to('#s4r',{opacity:1,duration:.35},T(35.76)); pulse('#s4r',T(35.8),1.08);
out(['#s4a','#s4b'],T(36.45),{duration:.3}); tl.to('#s4z',{y:-50,opacity:0,duration:.35,ease:'power3.in'},T(36.45));
up('#s4c',T(37.3)); up('#s4d',T(40.12));
tl.from('#mA',{x:-120,opacity:0,duration:.5,ease:'expo.out'},T(37.6));
tl.from('#mB',{x:120,opacity:0,duration:.5,ease:'expo.out'},T(38.0)); pulse('#mB',T(38.9),1.04);
out(['#s4k','#s4c','#s4d'],s4out,{stagger:.03}); tl.to('#s4maps',{y:-50,opacity:0,duration:.35,ease:'power3.in'},s4out);

/* 05 CTA */
const s5in=T(41.9);
show('#s5',s5in,DUR+1); chap(4,s5in);
up('#s5k',s5in+.05); up('#s5a',T(41.94));
const [save,follow]=$$('#s5cards > .card');
tl.from(save,{x:-200,opacity:0,duration:.6,ease:'expo.out'},T(42.0)); pulse(save.firstElementChild,T(42.4),1.15);
up('#s5b',T(42.92),{color:'#fff'}); tl.to('#s5b',{color:'#FFC400',duration:.25},T(43.14));
tl.from(follow,{x:-200,opacity:0,duration:.6,ease:'expo.out'},T(42.95));
pulse(follow.lastElementChild,T(43.49),1.12); pulse(follow.lastElementChild,T(45.0),1.08);
tl.to('#stage .brand',{scale:1.08,transformOrigin:'0 50%',duration:.3,yoyo:true,repeat:1,ease:'power2.out'},T(43.49));

MOTION.ready();
</script>
</body>
</html>
