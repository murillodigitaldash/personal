[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-trader"
version = "0.1.0"
description = "Robo trader para criptomoedas: ingestao de dados, backtest e execucao isolada"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
exchange = ["ccxt>=4.2"]
dev = ["pytest>=7.4"]

[project.scripts]
robo-trader = "robo_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
